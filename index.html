<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="css/style.css">
    <!-- Bootstrap -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
<script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    
</head>
<body>
    <div class="container">
    <div class="row">
            <div class="col" id="weekly-tasks">
        <form>
            <div>
                <label for="userName">Name:</label>
                <input type="text" id="userName" required>
            </div>
            
            <div>
                <label for="dailyGoal">Daily Task Goal:</label>
                <input type="number" id="dailyGoal" required>
            </div>
            
            <div>
                <label for="bonusTasks">Weekly Bonus Tasks:</label>
                <input type="number" id="bonusTasks" required>
            </div>

            </div>
            <button type="button" id="goal-btn">Calculate Goal</button>
        </form>

        <p id="goal-message"></p>
        <script src="js/task-manager.js"></script>
    </div>
</div>
</body>
</html>
